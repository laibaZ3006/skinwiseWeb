<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | SkinWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

    <nav class="navbar navbar-skinwise">
        <div class="container">
            <a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon">✿</span> skinwise</a>
            <a class="small text-decoration-none text-dark" href="index.html">← Back to home</a>
        </div>
    </nav>

    <main class="container auth-wrap">
        <div class="row justify-content-center align-items-center g-0 auth-card">

            <div class="col-lg-5 auth-side d-none d-lg-flex">
                <div>
                    <span class="auth-flower">✿</span>
                    <h2 class="fw-bold">Good to see you again.</h2>
                    <p>Pick up where your skincare planning left off.</p>
                    <div class="auth-side-pill">Your routine. Your pace. Your budget.</div>
                </div>
            </div>

            <div class="col-lg-7 p-4 p-md-5">
                <div class="form-area">
                    <span class="eyebrow">WELCOME BACK</span>
                    <h1 class="h2 fw-bold mt-2">Log in to SkinWise</h1>
                    <p class="text-secondary">Enter your details to continue.</p>

                    <form action="#" method="get">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input id="email" class="form-control form-control-lg" type="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" class="form-control form-control-lg" type="password" placeholder="Enter your password" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label small" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="small text-link">Forgot password?</a>
                        </div>

                        <button class="btn btn-primary-skin btn-lg w-100 rounded-pill" type="submit">Log in</button>
                    </form>

                    <p class="text-center small text-secondary mt-4 mb-0">
                        Don't have an account?
                        <a class="text-link fw-semibold" href="signup.html">Sign up</a>
                    </p>

                    
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
