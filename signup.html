<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | SkinWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

    <nav class="navbar navbar-skinwise">
        <div class="container">
            <a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon">✿</span> skinwise</a>
            <a class="small text-decoration-none text-dark" href="index.html">← Back to home</a>
        </div>
    </nav>

    <main class="container auth-wrap">
        <div class="row justify-content-center align-items-center g-0 auth-card">

            <div class="col-lg-5 auth-side signup-side d-none d-lg-flex">
                <div>
                    <span class="auth-flower">♡</span>
                    <h2 class="fw-bold">Start your skincare journey.</h2>
                    <p>Build your profile, explore skincare brands, and plan a routine that respects your budget.</p>
                    <div class="auth-side-pill">A simpler way to plan your skincare.</div>
                </div>
            </div>

            <div class="col-lg-7 p-4 p-md-5">
                <div class="form-area">
                    <span class="eyebrow">JOIN SKINWISE</span>
                    <h1 class="h2 fw-bold mt-2">Create your account</h1>
                    <p class="text-secondary">Enter your information to get started.</p>

                    <form action="#" method="get">

                        <div class="mb-3">
                            <label for="fullname" class="form-label">Full name</label>
                            <input id="fullname" class="form-control" type="text" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">Account type</label>
                            <select id="role" class="form-select" required>
                                <option value="">Select your role</option>
                                <option value="user">User</option>
                                <option value="admin">Admin (demo)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="signup-email" class="form-label">Email address</label>
                            <input id="signup-email" class="form-control" type="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="signup-password" class="form-label">Password</label>
                            <input id="signup-password" class="form-control" type="password" placeholder="Create a password" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirm-password" class="form-label">Confirm password</label>
                            <input id="confirm-password" class="form-control" type="password" placeholder="Enter your password again" required>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small" for="terms">I agree to the terms and conditions.</label>
                        </div>

                        <button class="btn btn-primary-skin btn-lg w-100 rounded-pill" type="submit">Create account</button>
                    </form>

                    <p class="text-center small text-secondary mt-4 mb-0">
                        Already have an account?
                        <a class="text-link fw-semibold" href="login.html">Log in</a>
                    </p>

                
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
